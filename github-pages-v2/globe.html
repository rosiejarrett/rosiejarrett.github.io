document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ior: contain; }\n  .chips::-webkit-scrollbar { width: 6px; }\n  .chips::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 999px; }\n  .chips::-webkit-scrollbar-track { background: transparent; }\n  .chip {\n    display: flex; align-items: center; gap: 7px;\n    padding: 5px 7px 5px 9px; border-radius: 999px;\n    border: 1px solid rgba(239,189,73,0.45);\n    background: rgba(239,189,73,0.13);\n    font-size: 11.5px; line-height: 1; color: #f6e3b4;\n  }\n  .chip button {\n    appearance: none; border: 0; background: none; padding: 0; cursor: pointer;\n    color: rgba(246,227,180,0.6); font: inherit; font-size: 13px; line-height: 1;\n  }\n  .chip button:hover { color: #fff; }\n  .empty { padding: 12px 0 2px; font-size: 11.5px; color: rgba(238,242,246,0.34); }\n  .add { display: flex; gap: 6px; margin-top: 14px; }\n  .add input {\n    flex: 1; min-width: 0; box-sizing: border-box;\n    padding: 8px 10px; border-radius: 8px;\n    border: 1px solid rgba(255,255,255,0.13);\n    background: rgba(255,255,255,0.05);\n    color: #eef2f6; font-family: inherit; font-size: 12px;\n  }\n  .add input::placeholder { color: rgba(238,242,246,0.32); }\n  .add input:focus { outline: none; border-color: rgba(239,189,73,0.6); }\n  .add button, .clear {\n    appearance: none; cursor: pointer; font-family: inherit;\n    border-radius: 8px; border: 1px solid rgba(255,255,255,0.13);\n    background: rgba(255,255,255,0.05); color: #eef2f6;\n    font-size: 12px; padding: 8px 11px;\n  }\n  .add button:hover, .clear:hover { background: rgba(255,255,255,0.12); }\n  .clear { margin-top: 8px; width: 100%; font-size: 11px; color: rgba(238,242,246,0.55); padding: 7px; }\n  .bulk { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.09); }\n  .bulk textarea {\n    width: 100%; box-sizing: border-box; resize: vertical;\n    padding: 8px 10px; border-radius: 8px;\n    border: 1px solid rgba(255,255,255,0.13);\n    background: rgba(255,255,255,0.05);\n    color: #eef2f6; font-family: inherit; font-size: 12px; line-height: 1.4;\n  }\n  .bulk textarea::placeholder { color: rgba(238,242,246,0.32); }\n  .bulk textarea:focus { outline: none; border-color: rgba(239,189,73,0.6); }\n  .bulkRow { display: flex; gap: 6px; margin-top: 6px; }\n  .bulkRow button {\n    flex: 1; appearance: none; cursor: pointer; font-family: inherit;\n    border-radius: 8px; border: 1px solid rgba(255,255,255,0.13);\n    background: rgba(255,255,255,0.05); color: #eef2f6;\n    font-size: 11.5px; padding: 7px 8px;\n  }\n  .bulkRow button:hover { background: rgba(255,255,255,0.12); }\n  .note { min-height: 13px; margin-top: 6px; font-size: 10.5px; line-height: 1.35; color: rgba(238,242,246,0.42); }\n  .status {\n    position: fixed; inset: 0; z-index: 4; display: flex;\n    align-items: center; justify-content: center; pointer-events: none;\n    font-family: \"Space Grotesk\", system-ui, sans-serif;\n    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;\n    color: rgba(238,242,246,0.45);\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<three-d-stage name=\"focus-globe\" background=\"#0a0d12\" autorotate=\"\"><\u002Fthree-d-stage>\n\n<div class=\"status\" id=\"status\">Loading country data…<\u002Fdiv>\n\n<div class=\"hud\">\n  <h1>Focus countries<\u002Fh1>\n  <p class=\"sub\">Click any country on the globe to mark or clear it.<\u002Fp>\n  <div class=\"lbl\"><span>Pinned<\u002Fspan><span class=\"count\" id=\"count\">0<\u002Fspan><\u002Fdiv>\n  <div class=\"chips\" id=\"chips\"><\u002Fdiv>\n  <div class=\"add\">\n    <input id=\"pinInput\" list=\"countryList\" placeholder=\"Add a country…\" autocomplete=\"off\">\n    <button id=\"pinAdd\" type=\"button\">Pin<\u002Fbutton>\n  <\u002Fdiv>\n  <datalist id=\"countryList\"><\u002Fdatalist>\n  <div class=\"bulk\">\n    <textarea id=\"bulkBox\" rows=\"2\" placeholder=\"Paste many at once: Kenya, Nepal, Brazil…\"><\u002Ftextarea>\n    <div class=\"bulkRow\">\n      <button id=\"bulkApply\" type=\"button\">Add list<\u002Fbutton>\n      <button id=\"bulkCopy\" type=\"button\">Copy current<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"note\" id=\"bulkNote\"><\u002Fdiv>\n  <\u002Fdiv>\n  <button class=\"clear\" id=\"clearAll\" type=\"button\">Clear all pins<\u002Fbutton>\n<\u002Fdiv>\n\n<script src=\"e02fb5b8-606a-49ee-b7b8-9b57831c9e7e\"><\u002Fscript>\n<script type=\"module\">\nimport * as THREE from 'three';\n\nconst DATA = window.__resources.worldAtlas;   // inlined country geometry\nconst STORE = 'focus-globe.pins.v2';\n// Baked-in default set — travels with the file, so the object is never\n// dependent on browser storage. Edit this list to change what ships.\nconst SEED = [\n  // story order first, then the rest of the countries we work in\n  'Nigeria', 'Central African Rep.', 'Switzerland',\n  'United Arab Emirates', 'Azerbaijan', 'Bangladesh',\n  'Benin', 'Brazil', 'Burkina Faso',\n  'Cambodia', 'Cameroon', 'Canada',\n  \"Côte d'Ivoire\", 'Dem. Rep. Congo', 'Denmark',\n  'Ecuador', 'Ethiopia', 'France',\n  'Germany', 'Ghana', 'India',\n  'Indonesia', 'Kazakhstan', 'Kenya',\n  'Kyrgyzstan', 'Malawi', 'Malaysia',\n  'Mongolia', 'Morocco', 'Mozambique',\n  'Myanmar', 'Nepal', 'Niger',\n  'Pakistan', 'Papua New Guinea', 'Peru',\n  'Philippines', 'Senegal', 'Sierra Leone',\n  'South Africa', 'Tajikistan', 'Tanzania',\n  'Uganda', 'Ukraine', 'United Kingdom',\n  'United States of America', 'Uzbekistan',\n];\n\nconst R_OCEAN = 0.9985;  // ocean sphere\nconst R_BOT   = 0.9995;  // land underside\nconst R_TOP   = 1.0010;  // land face — flat decal, not a raised plate\nconst INSET   = 0.16;    // degrees pulled back from each border -> dark seam\nconst STEP    = 4;       // max ring segment, degrees\nconst SUB     = 6;       // max interior edge, degrees\nconst DEG = Math.PI / 180;\n\nconst stage = document.querySelector('three-d-stage');\nconst { THREE: _T } = await stage.ready;\n\n/* ---- embed: strip the stage's own author chrome (export toolbar + orbit hint).\n       Pass ?chrome=1 to keep them. ---- */\nif (new URLSearchParams(location.search).get('chrome') !== '1') {\n  const st = document.createElement('style');\n  st.textContent = '.toolbar, .note { display: none !important; }';\n  stage.shadowRoot.appendChild(st);\n}\n\n/* ---- dark-studio relight (the starter ships a warm paper studio) ---- */\nstage._scene.traverse((o) => {\n  if (o.isHemisphereLight) {\n    o.color.set('#ffffff'); o.groundColor.set('#46525f'); o.intensity = 2.0;\n  } else if (o.isDirectionalLight) {\n    if (o.castShadow) { o.intensity = 1.05; o.position.set(5, 5.5, 6.5); }\n    else { o.color.set('#cfe0ff'); o.intensity = 0.85; o.position.set(-6, 1.5, -5); }\n  }\n});\n\n// A soft fill riding with the camera keeps whichever face you're looking at readable.\nconst viewFill = new THREE.DirectionalLight(0xffffff, 0.55);\nstage._scene.add(viewFill);\n(function follow() {\n  viewFill.position.copy(stage._camera.position);\n  requestAnimationFrame(follow);\n})();\n\n/* ---------------------------- materials ---------------------------- */\nconst mats = {\n  ocean: new THREE.MeshStandardMaterial({ name: 'ocean', color: '#0f151d', roughness: 0.85, metalness: 0.0 }),\n  land: new THREE.MeshStandardMaterial({ name: 'land', color: '#f7f9fb', roughness: 0.62, metalness: 0.0, emissive: '#ffffff', emissiveIntensity: 0.05 }),\n  land_pinned: new THREE.MeshStandardMaterial({ name: 'land_pinned', color: '#efbd49', roughness: 0.55, metalness: 0.0 }),\n  land_hover: new THREE.MeshStandardMaterial({ name: 'land_hover', color: '#9fb2c6', roughness: 0.6, metalness: 0.0 }),\n  graticule: new THREE.MeshStandardMaterial({ name: 'graticule', color: '#9aa5b1', roughness: 0.85, metalness: 0.0, emissive: '#9aa5b1', emissiveIntensity: 0.14 }),\n};\n\n/* ------------------------- geometry helpers ------------------------- */\nfunction proj(lon, lat, r) {\n  const la = lat * DEG, lo = lon * DEG, c = Math.cos(la);\n  return [r * c * Math.cos(lo), r * Math.sin(la), -r * c * Math.sin(lo)];\n}\nfunction signedArea(ring) {\n  let s = 0;\n  for (let i = 0, n = ring.length; i < n; i++) {\n    const a = ring[i], b = ring[(i + 1) % n];\n    s += a[0] * b[1] - b[0] * a[1];\n  }\n  return s / 2;\n}\n/** Make a ring continuous in longitude so antimeridian crossers don't\n *  smear a band around the globe. Out-of-range longitudes project fine. */\nfunction unwrap(ring) {\n  const out = [ring[0].slice()];\n  for (let i = 1; i < ring.length; i++) {\n    let lon = ring[i][0];\n    const prev = out[i - 1][0];\n    while (lon - prev > 180) lon -= 360;\n    while (lon - prev < -180) lon += 360;\n    out.push([lon, ring[i][1]]);\n  }\n  return out;\n}\n/** Pull a ring inward (per its winding) so neighbouring countries never touch. */\nfunction insetRing(ring, d) {\n  const n = ring.length, out = [];\n  for (let i = 0; i < n; i++) {\n    const p = ring[i], prev = ring[(i - 1 + n) % n], next = ring[(i + 1) % n];\n    if (Math.abs(p[1]) > 88 || Math.abs(Math.abs(p[0]) - 180) < 0.01) { out.push(p.slice()); continue; }  // keep polar + antimeridian seams closed\n    const k = Math.max(Math.cos(p[1] * DEG), 0.15);\n    let nx = 0, ny = 0;\n    for (const [a, b] of [[prev, p], [p, next]]) {\n      const ex = (b[0] - a[0]) * k, ey = b[1] - a[1];\n      const L = Math.hypot(ex, ey) || 1;\n      nx += -ey / L; ny += ex / L;\n    }\n    const L = Math.hypot(nx, ny) || 1;\n    out.push([p[0] + (d * nx / L) / k, p[1] + (d * ny / L) / k]);\n  }\n  return out;\n}\nfunction densify(ring, step) {\n  const out = [];\n  for (let i = 0, n = ring.length; i < n; i++) {\n    const a = ring[i], b = ring[(i + 1) % n];\n    out.push(a);\n    const segs = Math.floor(Math.hypot(b[0] - a[0], b[1] - a[1]) / step);\n    for (let k = 1; k <= segs; k++) {\n      const t = k / (segs + 1);\n      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);\n    }\n  }\n  return out;\n}\nfunction prepRing(raw, isOuter) {\n  let ring = raw.slice();\n  const first = ring[0], last = ring[ring.length - 1];\n  if (first[0] === last[0] && first[1] === last[1]) ring.pop();\n  if (ring.length < 3) return null;\n  ring = unwrap(ring).map((p) => [p[0], Math.max(-89.85, Math.min(89.85, p[1]))]);  // never collapse on a pole\n  // A ring that sweeps the full 360° (Antarctica) is open at the pole — walk it shut.\n  const span = ring[ring.length - 1][0] - ring[0][0];\n  if (Math.abs(span) > 300) {\n    const poleLat = ring.reduce((s, p) => s + p[1], 0) / ring.length < 0 ? -89.85 : 89.85;\n    const a = ring[ring.length - 1][0], b = ring[0][0];\n    for (let k = 1; k <= 5; k++) ring.push([a + ((b - a) * k) / 6, poleLat]);\n  }\n  const area = signedArea(ring);\n  if (Math.abs(area) < 1e-6) return null;\n  if ((isOuter && area < 0) || (!isOuter && area > 0)) ring.reverse();\n  const shrunk = insetRing(ring, INSET);\n  const a2 = signedArea(shrunk);\n  const ok = Math.sign(a2) === Math.sign(signedArea(ring)) && Math.abs(a2) > Math.abs(area) * 0.18;\n  return densify(ok ? shrunk : ring, STEP);\n}\nfunction subdivide(verts, faces, maxEdge) {\n  const d2 = maxEdge * maxEdge;\n  for (let pass = 0; pass < 6; pass++) {\n    const mid = new Map();\n    const midpoint = (a, b) => {\n      const key = a < b ? a + ':' + b : b + ':' + a;\n      let m = mid.get(key);\n      if (m === undefined) {\n        m = verts.length;\n        verts.push([(verts[a][0] + verts[b][0]) / 2, (verts[a][1] + verts[b][1]) / 2]);\n        mid.set(key, m);\n      }\n      return m;\n    };\n    const long = (a, b) => {\n      const dx = (verts[a][0] - verts[b][0]) * Math.max(Math.cos((verts[a][1] + verts[b][1]) / 2 * DEG), 0.2);\n      const dy = verts[a][1] - verts[b][1];\n      return dx * dx + dy * dy > d2;\n    };\n    const next = [];\n    let changed = false;\n    for (const f of faces) {\n      const [a, b, c] = f;\n      if (!(long(a, b) || long(b, c) || long(c, a))) { next.push(f); continue; }\n      changed = true;\n      const ab = midpoint(a, b), bc = midpoint(b, c), ca = midpoint(c, a);\n      next.push([a, ab, ca], [ab, b, bc], [ca, bc, c], [ab, bc, ca]);\n    }\n    faces = next;\n    if (!changed) break;\n  }\n  return faces;\n}\n\nfunction buildCountry(name, polygons) {\n  const pos = [], nor = [];\n  const push = (v, n) => { pos.push(v[0], v[1], v[2]); nor.push(n[0], n[1], n[2]); };\n  const shell = (A, B, C, r, outward) => {\n    const a = proj(A[0], A[1], r), b = proj(B[0], B[1], r), c = proj(C[0], C[1], r);\n    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];\n    const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];\n    const fx = uy * vz - uz * vy, fy = uz * vx - ux * vz, fz = ux * vy - uy * vx;\n    const facing = fx * a[0] + fy * a[1] + fz * a[2] > 0;\n    const tri = (outward === facing) ? [a, b, c] : [a, c, b];\n    const s = outward ? 1 / r : -1 / r;\n    for (const p of tri) push(p, [p[0] * s, p[1] * s, p[2] * s]);\n  };\n  const wall = (ring) => {\n    for (let i = 0, n = ring.length; i < n; i++) {\n      const A = ring[i], B = ring[(i + 1) % n];\n      const t0 = proj(A[0], A[1], R_TOP), t1 = proj(B[0], B[1], R_TOP);\n      const b0 = proj(A[0], A[1], R_BOT), b1 = proj(B[0], B[1], R_BOT);\n      for (const tri of [[b0, b1, t1], [b0, t1, t0]]) {\n        const [p, q, s] = tri;\n        const ux = q[0] - p[0], uy = q[1] - p[1], uz = q[2] - p[2];\n        const vx = s[0] - p[0], vy = s[1] - p[1], vz = s[2] - p[2];\n        let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;\n        const L = Math.hypot(nx, ny, nz) || 1;\n        nx /= L; ny /= L; nz /= L;\n        for (const v of tri) push(v, [nx, ny, nz]);\n      }\n    }\n  };\n\n  for (const poly of polygons) {\n    const rings = poly.map((r, i) => prepRing(r, i === 0)).filter(Boolean);\n    if (!rings.length) continue;\n    const contour = rings[0].map((p) => new THREE.Vector2(p[0], p[1]));\n    const holes = rings.slice(1).map((r) => r.map((p) => new THREE.Vector2(p[0], p[1])));\n    const verts = rings.flat().map((p) => [p[0], p[1]]);\n    let faces;\n    try { faces = THREE.ShapeUtils.triangulateShape(contour, holes); } catch (e) { continue; }\n    if (!faces || !faces.length) continue;\n    faces = subdivide(verts, faces, SUB);\n    for (const f of faces) {\n      shell(verts[f[0]], verts[f[1]], verts[f[2]], R_TOP, true);\n      shell(verts[f[0]], verts[f[1]], verts[f[2]], R_BOT, false);\n    }\n    for (const ring of rings) wall(ring);\n  }\n\n  if (!pos.length) return null;\n  const g = new THREE.BufferGeometry();\n  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));\n  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));\n  const mesh = new THREE.Mesh(g, mats.land);\n  mesh.name = name.replace(/[^\\w]+/g, '_');\n  mesh.userData.country = name;\n  return mesh;\n}\n\nfunction graticule() {\n  const grp = new THREE.Group();\n  grp.name = 'graticule';\n  const r = R_OCEAN, tube = 0.0011;\n  for (const lat of [-60, -30, 0, 30, 60]) {\n    const rr = r * Math.cos(lat * DEG);\n    const m = new THREE.Mesh(new THREE.TorusGeometry(rr, lat === 0 ? tube * 1.7 : tube, 6, 220), mats.graticule);\n    m.rotation.x = Math.PI / 2;\n    m.position.y = r * Math.sin(lat * DEG);\n    m.name = 'parallel_' + lat;\n    grp.add(m);\n  }\n  for (let lon = 0; lon < 180; lon += 30) {\n    const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 6, 240), mats.graticule);\n    m.rotation.y = -lon * DEG + Math.PI / 2;\n    m.name = 'meridian_' + lon;\n    grp.add(m);\n  }\n  return grp;\n}\n\n/* ----------------------------- build ------------------------------ */\nconst topology = await fetch(DATA).then((r) => r.json());\nconst features = topojson.feature(topology, topology.objects.countries).features\n  .filter((f) => f.properties && f.properties.name);\n\nconst model = new THREE.Group();\nmodel.name = 'focus_globe';\n\nconst ocean = new THREE.Mesh(new THREE.SphereGeometry(R_OCEAN, 128, 96), mats.ocean);\nocean.name = 'ocean';\nmodel.add(ocean, graticule());\n\nconst landGroup = new THREE.Group(); landGroup.name = 'countries';\nmodel.add(landGroup);\n\nconst byName = new Map();     // name -> mesh\nconst centroid = new Map();   // name -> [lon, lat]\n\nfor (const f of features) {\n  const name = f.properties.name;\n  const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;\n  const mesh = buildCountry(name, polys);\n  if (!mesh) continue;\n  landGroup.add(mesh);\n  byName.set(name, mesh);\n  let best = null, bestA = -1;\n  for (const p of polys) {\n    const a = Math.abs(signedArea(p[0]));\n    if (a > bestA) { bestA = a; best = p; }\n  }\n  centroid.set(name, d3.geoCentroid({ type: 'Polygon', coordinates: best }));\n}\n\nstage.setObject(model);\ndocument.getElementById('status').remove();\n\n/* ---- embed: fill the host's box better than the auto-frame does ---- */\nfunction frame(dist) {\n  const t = stage._controls.target;\n  const dir = stage._camera.position.clone().sub(t).normalize();\n  stage._camera.position.copy(t).add(dir.multiplyScalar(dist));\n  stage._controls.update();\n}\nframe(2.55);\naddEventListener('resize', () => frame(2.55));\n\n/* --------------------------- pin state ---------------------------- */\nlet pinned = SEED.filter((n) => byName.has(n));   // embed: host-driven, no localStorage\n\nconst chips = document.getElementById('chips');\nconst countEl = document.getElementById('count');\nconst list = document.getElementById('countryList');\nlist.innerHTML = [...byName.keys()].sort().map((n) => `<option value=\"${n}\"><\u002Foption>`).join('');\n\nfunction render() {\n  for (const m of landGroup.children) {\n    m.material = pinned.includes(m.userData.country) ? mats.land_pinned : mats.land;\n  }\n  countEl.textContent = String(pinned.length);\n  chips.innerHTML = pinned.length\n    ? pinned.map((n, i) => `<span class=\"chip\">${n}<button type=\"button\" data-i=\"${i}\" aria-label=\"Remove ${n}\">×<\u002Fbutton><\u002Fspan>`).join('')\n    : '<div class=\"empty\">No pins yet.<\u002Fdiv>';\n}\nfunction toggle(name) {\n  const i = pinned.indexOf(name);\n  if (i >= 0) pinned.splice(i, 1); else pinned.push(name);\n  render();\n}\nrender();\n\nchips.addEventListener('click', (e) => {\n  const b = e.target.closest('button[data-i]');\n  if (!b) return;\n  pinned.splice(Number(b.dataset.i), 1);\n  render();\n});\ndocument.getElementById('clearAll').addEventListener('click', () => { pinned = []; render(); });\nconst input = document.getElementById('pinInput');\nfunction addFromInput() {\n  const v = input.value.trim().toLowerCase();\n  const hit = [...byName.keys()].find((n) => n.toLowerCase() === v)\n    || [...byName.keys()].find((n) => n.toLowerCase().startsWith(v) && v.length > 1);\n  if (hit && !pinned.includes(hit)) { pinned.push(hit); render(); }\n  input.value = '';\n}\ndocument.getElementById('pinAdd').addEventListener('click', addFromInput);\ninput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addFromInput(); });\n\n/* ---- bulk paste / copy: re-enter or hand off a whole list at once ---- */\nconst note = document.getElementById('bulkNote');\nconst lower = new Map([...byName.keys()].map((n) => [n.toLowerCase(), n]));\nconst ALIAS = {\n  'usa': 'United States of America', 'us': 'United States of America',\n  'united states': 'United States of America', 'uk': 'United Kingdom',\n  'drc': 'Dem. Rep. Congo', 'dr congo': 'Dem. Rep. Congo',\n  'democratic republic of the congo': 'Dem. Rep. Congo',\n  'republic of the congo': 'Congo', 'ivory coast': \"C\\u00f4te d'Ivoire\",\n  'south korea': 'South Korea', 'north korea': 'North Korea',\n  'bosnia': 'Bosnia and Herz.', 'czech republic': 'Czechia',\n  'central african republic': 'Central African Rep.',\n  'dominican republic': 'Dominican Rep.', 'south sudan': 'S. Sudan',\n  'uae': 'United Arab Emirates', 'burma': 'Myanmar',\n  'palestine': 'Palestine', 'swaziland': 'eSwatini',\n};\nfunction resolve(raw) {\n  const v = raw.trim().toLowerCase().replace(/\\s+/g, ' ');\n  if (!v) return null;\n  return lower.get(v) || ALIAS[v] && byName.has(ALIAS[v]) && ALIAS[v]\n    || [...lower.keys()].filter((k) => k.startsWith(v)).length === 1\n       && lower.get([...lower.keys()].find((k) => k.startsWith(v)))\n    || null;\n}\ndocument.getElementById('bulkApply').addEventListener('click', () => {\n  const box = document.getElementById('bulkBox');\n  const parts = box.value.split(/[,;\\n\\t]+/).map((s) => s.trim()).filter(Boolean);\n  const added = [], missed = [];\n  for (const p of parts) {\n    const hit = resolve(p);\n    if (!hit) { missed.push(p); continue; }\n    if (!pinned.includes(hit)) { pinned.push(hit); added.push(hit); }\n  }\n  render();\n  note.textContent = [\n    added.length ? `Added ${added.length}.` : 'Nothing new added.',\n    missed.length ? `Not recognised: ${missed.join(', ')}` : '',\n  ].filter(Boolean).join(' ');\n  if (added.length) box.value = '';\n});\ndocument.getElementById('bulkCopy').addEventListener('click', async () => {\n  const text = pinned.join(', ');\n  try {\n    await navigator.clipboard.writeText(text);\n    note.textContent = `Copied ${pinned.length} name${pinned.length === 1 ? '' : 's'}.`;\n  } catch (e) {\n    document.getElementById('bulkBox').value = text;\n    note.textContent = 'Copy blocked — list placed in the box instead.';\n  }\n});\n\n/* -------------------- click / hover on the globe ------------------- */\nconst canvas = stage.shadowRoot.querySelector('canvas');\nconst ray = new THREE.Raycaster();\nconst ndc = new THREE.Vector2();\nlet hovered = null, down = null;\n\nfunction hit(ev) {\n  const r = canvas.getBoundingClientRect();\n  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);\n  ray.setFromCamera(ndc, stage._camera);\n  const list = ray.intersectObjects(landGroup.children, false);\n  return list.length ? list[0].object : null;\n}\ncanvas.addEventListener('pointermove', (ev) => {\n  const m = hit(ev);\n  if (m === hovered) return;\n  if (hovered && !pinned.includes(hovered.userData.country)) hovered.material = mats.land;\n  hovered = m;\n  if (m && !pinned.includes(m.userData.country)) m.material = mats.land_hover;\n  canvas.style.cursor = m ? 'pointer' : 'default';\n});\ncanvas.addEventListener('pointerdown', (ev) => { down = [ev.clientX, ev.clientY]; });\ncanvas.addEventListener('pointerup', (ev) => {\n  if (!down) return;\n  const moved = Math.hypot(ev.clientX - down[0], ev.clientY - down[1]);\n  down = null;\n  if (moved > 5) return;\n  const m = hit(ev);\n  if (m) { hovered = null; const n = m.userData.country; toggle(n); emit(n); }\n});\n\n/* ----------------------- embedding API ---------------------------- *\n *  window.Globe.focus('Kenya')      rotate the globe to a country\n *  window.Globe.setMarked([...])    replace the highlighted set\n *  window.Globe.onSelect(cb)        user clicked a country\n *  In an iframe: postMessage({type:'globe:focus', country:'Kenya'})\n *  URL params: ?hud=0&marked=Kenya,Nepal&focus=Kenya\n * ------------------------------------------------------------------ */\nconst listeners = [];\nlet anim = null;\n\nfunction basis(x, up) {\n  let y = up.clone().sub(x.clone().multiplyScalar(up.dot(x)));\n  if (y.lengthSq() < 1e-6) y = new THREE.Vector3(0, 0, 1).sub(x.clone().multiplyScalar(x.z));\n  y.normalize();\n  const z = new THREE.Vector3().crossVectors(x, y);\n  return new THREE.Matrix4().makeBasis(x, y, z);\n}\nfunction targetQuat(lon, lat) {\n  const up = new THREE.Vector3(0, 1, 0);\n  const a = new THREE.Vector3(...proj(lon, lat, 1));\n  const b = stage._camera.position.clone().sub(stage._controls.target).normalize();\n  const m1 = basis(a, up), m2 = basis(b, up);\n  m1.transpose();\n  return new THREE.Quaternion().setFromRotationMatrix(m2.multiply(m1));\n}\nfunction focusCountry(name, ms) {\n  const c = centroid.get(name);\n  if (!c) return Promise.resolve(false);\n  stage._controls.autoRotate = false;\n  const from = model.quaternion.clone();\n  const to = targetQuat(c[0], c[1]);\n  const dur = Math.max(1, ms === undefined ? 900 : ms);\n  const t0 = performance.now();\n  if (anim) cancelAnimationFrame(anim);\n  return new Promise((done) => {\n    const step = () => {\n      const k = Math.min(1, (performance.now() - t0) / dur);\n      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;\n      model.quaternion.slerpQuaternions(from, to, e);\n      if (k < 1) { anim = requestAnimationFrame(step); } else { anim = null; done(true); }\n    };\n    step();\n  });\n}\nfunction emit(country) {\n  for (const cb of listeners) { try { cb(country, pinned.slice()); } catch (e) {} }\n  try { parent.postMessage({ type: 'globe:selected', country, marked: pinned.slice() }, '*'); } catch (e) {}\n}\n\nconst Globe = {\n  countries: [...byName.keys()].sort(),\n  order: SEED.slice(0, 4),      // story order as authored\n  focus: focusCountry,\n  next(ms) {                    // advance through the story order\n    const list = SEED.slice(0, 4).filter((n) => byName.has(n));\n    if (!list.length) return Promise.resolve(false);\n    this._i = ((this._i === undefined ? -1 : this._i) + 1) % list.length;\n    return focusCountry(list[this._i], ms);\n  },\n  get marked() { return pinned.slice(); },\n  setMarked(names) { pinned = (names || []).filter((n) => byName.has(n)); render(); },\n  mark(n) { if (byName.has(n) && !pinned.includes(n)) { pinned.push(n); render(); } },\n  unmark(n) { const i = pinned.indexOf(n); if (i >= 0) { pinned.splice(i, 1); render(); } },\n  clearMarks() { pinned = []; render(); },\n  onSelect(cb) { if (typeof cb === 'function') listeners.push(cb); },\n  hud(on) { document.querySelector('.hud').style.display = on ? '' : 'none'; },\n  autorotate(on) { stage._controls.autoRotate = !!on; },\n};\nwindow.Globe = Globe;\n\nwindow.addEventListener('message', (ev) => {\n  const d = ev.data || {};\n  if (d.type === 'globe:focus') Globe.focus(d.country, d.ms);\n  else if (d.type === 'globe:setMarked') Globe.setMarked(d.countries);\n  else if (d.type === 'globe:mark') Globe.mark(d.country);\n  else if (d.type === 'globe:unmark') Globe.unmark(d.country);\n  else if (d.type === 'globe:clear') Globe.clearMarks();\n  else if (d.type === 'globe:hud') Globe.hud(!!d.show);\n  else if (d.type === 'globe:autorotate') Globe.autorotate(d.on);\n});\n\nconst q = new URLSearchParams(location.search);\nif (q.get('hud') === '0' || q.get('hud') === 'off') Globe.hud(false);\nif (q.has('marked')) Globe.setMarked(q.get('marked').split(',').map((s) => s.trim()));\nif (q.has('focus')) Globe.focus(q.get('focus'), 0);\ntry { parent.postMessage({ type: 'globe:ready', countries: Globe.countries }, '*'); } catch (e) {}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
